<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Favicon de PSJavaScript -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#58cc02" />

    <!-- Tipografía de la marca (redondeada) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" />
    <script>
      (function() {
        try {
          var isGh = window.location.hostname.endsWith('github.io');
          var parts = window.location.pathname.split('/').filter(Boolean);
          var base = (isGh && parts.length > 0) ? ('/' + parts[0] + '/') : './';
          var setFav = function(rel, href, type) {
            var el = document.querySelector("link[rel='" + rel + "']") || document.createElement('link');
            el.rel = rel;
            if (type) el.type = type;
            el.href = base + href;
            if (!el.parentNode) document.head.appendChild(el);
          };
          setFav('icon', 'favicon.png?v=2', 'image/png');
          setFav('shortcut icon', 'favicon.ico?v=2');
          setFav('apple-touch-icon', 'apple-touch-icon.png?v=2');
        } catch (e) {}
      })();
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Necesitas activar JavaScript para ejecutar PSJavaScript.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
