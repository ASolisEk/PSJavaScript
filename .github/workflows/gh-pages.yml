name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Inject Base URL for GitHub Pages
        run: |
          # Get the repository name (e.g., PSJavaScript from angelsolisek/PSJavaScript)
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f 2)
          # Inject it into app.json so Expo Router knows the subpath
          jq ".expo.experiments.baseUrl = \"/$REPO_NAME\"" app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Export Web
        run: npx expo export -p web

      - name: Ensure Subpath Favicons in dist
        run: |
          REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f 2)
          # Asegurar que las referencias de favicon en dist/index.html incluyan la subruta del repositorio
          sed -i "s|href=\"/favicon|href=\"/$REPO_NAME/favicon|g" dist/index.html || true
          sed -i "s|href=\"/apple-touch-icon|href=\"/$REPO_NAME/apple-touch-icon|g" dist/index.html || true
          sed -i "s|href=\"\./favicon|href=\"/$REPO_NAME/favicon|g" dist/index.html || true
          sed -i "s|href=\"\./apple-touch-icon|href=\"/$REPO_NAME/apple-touch-icon|g" dist/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
