name: Pruebas

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 trae WebSocket global (prueba del servidor del aula)
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npx expo lint

      - name: Pruebas del núcleo
        run: npm test

      - name: Compilar versión web
        run: npx expo export --platform web
